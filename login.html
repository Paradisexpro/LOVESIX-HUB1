<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — PixelVault</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <span class="brand-mark">◆</span>
      <h2>เข้าสู่ระบบ</h2>
      <p class="mb-0">ยินดีต้อนรับกลับสู่ PixelVault</p>
    </div>

    <div id="error-mount"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
    </form>

    <div class="auth-foot">
      ยังไม่มีบัญชี? <a href="register.html" style="color:var(--mint)">สมัครสมาชิก</a>
    </div>
    <div class="auth-foot">
      บัญชีทดลอง: <b>demo</b> / <b>demo1234</b> — แอดมิน: <b>admin</b> / <b>admin123</b>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  initDB().then(() => {
    renderHeader("");

    const cur = getCurrentUser();
    if (cur) window.location.href = "index.html";

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = loginUser(username, password);
      const mount = document.getElementById("error-mount");
      if (!result.ok) {
        mount.innerHTML = `<div class="error-box">${escapeHtml(result.error)}</div>`;
        return;
      }
      window.location.href = "index.html";
    });
  });
</script>
</body>
</html>
