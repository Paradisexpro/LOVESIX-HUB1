<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOVE SIXHUB — ตลาดไอดีเกม</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <div class="hero-eyebrow">ตลาดซื้อขายไอดีเกม</div>
      <h1>ตลาดซื้อขายไอดีเกมและเติมราคาถูก</h1>
      <p class="hero-sub">
        เติมเกมอย่างปลอดภัยไว้ใจได้ต้อง LOVESIX HUB
      </p>
      <div class="hero-stats">
        <div class="hero-stat"><b id="stat-categories">0</b><span>หมวดหมู่เกม</span></div>
        <div class="hero-stat"><b id="stat-products">0</b><span>บัญชีในระบบ</span></div>
        <div class="hero-stat"><b id="stat-sold">0</b><span>ออเดอร์สำเร็จ</span></div>
      </div>
    </div>
    <div class="hero-art">🎮</div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>สินค้าทั้งหมด</h2>
        <p>เลือกหมวดหมู่หรือค้นหาชื่อบัญชีที่ต้องการ</p>
      </div>
      <div style="min-width:260px">
        <input type="text" id="search-input" placeholder="ค้นหาชื่อบัญชี..." />
      </div>
    </div>

    <div class="cat-row" id="cat-row"></div>

    <div class="product-grid" id="product-grid"></div>
  </div>
</section>

<footer>© 2026 LOVE SIXHUB </footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
<script>initDB().then(() => initShop());</script>
</body>
</html>
