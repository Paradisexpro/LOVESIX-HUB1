<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สมัครสมาชิก — LOVE SIXHUB</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <span class="brand-mark">◆</span>
      <h2>สมัครสมาชิก</h2>
      <p class="mb-0">สร้างบัญชีเพื่อเริ่มซื้อขายไอดีเกม</p>
    </div>

    <div id="error-mount"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="confirm">ยืนยันรหัสผ่าน</label>
        <input type="password" id="confirm" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">สมัครสมาชิก</button>
    </form>

    <div class="auth-foot">
      มีบัญชีอยู่แล้ว? <a href="login.html" style="color:var(--mint)">เข้าสู่ระบบ</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  initDB().then(() => {
    renderHeader("");

    const cur = getCurrentUser();
    if (cur) window.location.href = "index.html";

    document.getElementById("register-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const result = registerUser(username, password, confirm);
      const mount = document.getElementById("error-mount");
      if (!result.ok) {
        mount.innerHTML = `<div class="error-box">${escapeHtml(result.error)}</div>`;
        return;
      }
      window.location.href = "index.html";
    });
  });
</script>
</body>
</html>
