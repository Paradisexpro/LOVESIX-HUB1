<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVESIX - Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="min-h-screen flex flex-col">
        <!-- Topbar -->
        <header class="bg-gray-900 text-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <h1 class="text-xl font-bold tracking-widest text-yellow-500">LOVESIX ADMIN</h1>
                <a href="../index.html" target="_blank" class="text-sm text-gray-300 hover:text-white flex items-center gap-2">
                    <i class="fas fa-external-link-alt"></i> ดูหน้าเว็บไซต์
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-10">
            
            <div class="bg-white rounded-lg shadow-md p-6 md:p-8">
                <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-4">เพิ่มสินค้าใหม่</h2>
                
                <form id="add-product-form" class="space-y-6">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า <span class="text-red-500">*</span></label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียดสินค้า</label>
                        <textarea id="description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ราคาปกติ (บาท) <span class="text-red-500">*</span></label>
                            <input type="number" id="fullPrice" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ราคาลดแล้ว (บาท)</label>
                            <input type="number" id="salePrice" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors" placeholder="เว้นว่างไว้ถ้าราคาปกติ">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL รูปภาพสินค้า <span class="text-red-500">*</span></label>
                        <input type="url" id="imageUrl" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors" placeholder="https://...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL ลิงก์ตัวอย่างสินค้า (ถ้ามี)</label>
                        <input type="url" id="sampleLink" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors" placeholder="https://...">
                    </div>

                    <div id="status-message" class="hidden p-4 rounded-md text-sm"></div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" id="submit-btn" class="bg-gray-900 text-white px-6 py-2.5 rounded-md hover:bg-gray-800 transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> บันทึกสินค้า
                        </button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
